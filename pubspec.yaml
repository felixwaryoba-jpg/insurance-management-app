name: insurance_management_app
description: A comprehensive Flutter-based Insurance Management Mobile Application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # Database
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # API & Networking
  http: ^1.1.0
  dio: ^5.3.1
  
  # UI Components
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  intl: ^0.19.0
  
  # Local Notifications
  flutter_local_notifications: ^15.1.1
  timezone: ^0.9.2
  
  # Authentication
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  
  # File Handling
  file_picker: ^6.0.0
  pdf: ^3.10.1
  permission_handler: ^11.4.4
  
  # Date & Time
  table_calendar: ^3.0.9
  
  # Others
  cached_network_image: ^3.3.0
  connectivity_plus: ^5.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
